plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.compose.compiler)
    id 'com.google.devtools.ksp'
    //id 'com.android.application'
    //id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aitech.weartak_civ'
    compileSdk 35

    defaultConfig {
        applicationId "com.aitech.weartak_civ"
        minSdk 34
        targetSdk 34
        versionCode 51
        versionName "0.58.1"
        vectorDrawables {
            useSupportLibrary true
        }
        setProperty("archivesBaseName", "$rootProject.name-$versionName-$versionCode-"+gitBranch())
        manifestPlaceholders["repo"] = gitUrl()
        manifestPlaceholders["branch"] = gitBranch()
        manifestPlaceholders["commit"] = gitCommit()
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
    }

    signingConfigs {
        debug {
            storeFile file("weartak.keystore")
            storePassword '112358key!'
            keyAlias 'platform'
            keyPassword '112358key!'
        }

        release {
            storeFile file("weartak.keystore")
            storePassword '112358key!'
            keyAlias 'platform'
            keyPassword '112358key!'
        }
    }

    splits {
        abi {
            enable true
            reset()
            //include "x86", "armeabi-v7a", "arm64-v8a", "x86_64"
            include "armeabi-v7a"
            universalApk true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packaging {
        resources {
            exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'
}

dependencies {
    //implementation fileTree(dir: 'libs', include: '*.aar')
    implementation files('libs/samsung-health-sensor-api-1.3.0.aar')
    implementation files('libs/hail-sdk.aar')

    implementation libs.protolite.well.known.types
    implementation libs.animation.core
    implementation libs.datastore.core

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation 'com.google.code.gson:gson:2.13.1'

    implementation "live.ditto:ditto:4.10.2"

    // HIVE BLE mesh sync (replaces Ditto for power-efficient P2P)
    // Use Maven dependency so composite build substitution works
    implementation 'com.revolveteam:hive:0.0.10'
    // HIVE Lite - CannedMessage primitives (UniFFI bindings)
    implementation files('../../hive-lite/android/build/outputs/aar/hive-lite-android-release.aar')
    implementation "net.java.dev.jna:jna:5.14.0@aar"  // Required by UniFFI
    implementation libs.play.services.wearable
    implementation platform(libs.compose.bom)
    implementation libs.ui
    implementation libs.ui.tooling.preview
    implementation libs.compose.material
    implementation libs.compose.foundation
    implementation libs.activity.compose
    implementation libs.core.splashscreen
    implementation libs.tiles
    implementation libs.tiles.material
    implementation libs.horologist.compose.tools
    implementation libs.horologist.tiles
    implementation libs.watchface.complications.data.source.ktx

//    implementation libs.navigation.compose
    implementation 'com.beust:klaxon:5.5'

    // bouncycastle for CSR generation
    implementation 'org.bouncycastle:bcprov-lts8on:2.73.7'
    implementation 'org.bouncycastle:bcpkix-lts8on:2.73.7'
    runtimeOnly 'org.bouncycastle:bcutil-lts8on:2.73.7'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // For BLE beacon detection and parsing
    implementation('com.davidgyoungtech:beacon-parsers:1.0') {
        exclude group: 'org.altbeacon'
    }
    implementation 'org.altbeacon:android-beacon-library:2.+'

    // Health Services
    //implementation libs.androidx
    //implementation libs.androidx.health.services

    // Used to bridge between Futures and coroutines
    //implementation libs.guava
    //implementation libs.concurrent.futures

    // Used for WorkManager
    //implementation libs.androidx.work
    //implementation libs.androidx.work.ktx

    // Used for Datastore
    //implementation libs.androidx.datastore

    // Used for permissions
    //implementation libs.accompanist.permissions

    implementation("androidx.compose.material:material-icons-core:1.7.5")
    implementation("androidx.wear.compose:compose-navigation:1.5.0-alpha05")
    implementation("androidx.health:health-services-client:1.1.0-alpha05")
    implementation("androidx.concurrent:concurrent-futures:1.2.0")
    implementation("org.greenrobot:eventbus:3.3.1")


    // Kotlin
    implementation("androidx.concurrent:concurrent-futures-ktx:1.2.0")

    implementation("androidx.datastore:datastore-preferences:1.1.1")
    implementation libs.play.services.location
    implementation "androidx.wear:wear-ongoing:1.0.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation libs.runtime.livedata
    implementation libs.material3.android

    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"

    // For HAIL
    api("io.jsonwebtoken:jjwt-api:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-orgjson:0.12.6") {
        exclude group: "org.json", module: "json"
    }
    implementation("org.apache.commons:commons-lang3:3.18.0")

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.ui.test.junit4
    debugImplementation libs.ui.tooling
