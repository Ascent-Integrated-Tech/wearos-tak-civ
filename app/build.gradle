import java.time.Instant

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
    id 'com.google.devtools.ksp'
    //id 'com.android.application'
    //id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}

android {
    namespace 'com.aitech.weartak_civ'
    compileSdk 35

    androidResources {
        noCompress 'onnx', 'tflite'
    }

    defaultConfig {
        applicationId "com.aitech.weartak_civ"
        minSdk 34
        targetSdk 34
        def baseVersionCode = 583
        def baseVersionName = "5.8.0.3"

        def buildGitUrl = gitUrl() ?: "unknown"
        def buildGitBranch = gitBranch() ?: "unknown"
        def buildGitCommit = gitCommit() ?: "unknown"

        def buildGitCommitShort = buildGitCommit.length() >= 8 ? buildGitCommit.substring(0, 8) : buildGitCommit

        // CI builds get a unique, increasing versionCode per GitLab pipeline so MDMs such as
        // Knox Manage accept each upload, and a versionName that identifies the pipeline/commit.
        def ciPipelineIid = System.getenv("CI_PIPELINE_IID")?.isInteger() ? System.getenv("CI_PIPELINE_IID").toInteger() : null
        if (ciPipelineIid != null) {
            if (ciPipelineIid >= 10000) {
                throw new GradleException("CI_PIPELINE_IID ${ciPipelineIid} exceeds the versionCode pipeline range (0-9999).")
            }
            versionCode baseVersionCode * 10000 + ciPipelineIid
            versionName "${baseVersionName}-p${ciPipelineIid}+${(System.getenv('CI_COMMIT_SHORT_SHA') ?: buildGitCommitShort)}"
        } else {
            versionCode baseVersionCode
            versionName baseVersionName
        }
        def safeGitBranch = buildGitBranch.replaceAll("[^A-Za-z0-9._-]", "-")

        def buildTimestampUtc = System.getenv("WEARTAK_BUILD_TIMESTAMP_UTC") ?: Instant.now().toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        setProperty("archivesBaseName", "${rootProject.name}-${baseVersionName}-${versionCode}-" + "${safeGitBranch}-${buildGitCommitShort}")

        buildConfigField "String", "GIT_REPOSITORY", "\"${buildGitUrl}\""
        buildConfigField "String", "GIT_BRANCH", "\"${buildGitBranch}\""
        buildConfigField "String", "GIT_COMMIT", "\"${buildGitCommit}\""
        buildConfigField "String", "GIT_COMMIT_SHORT", "\"${buildGitCommitShort}\""
        buildConfigField("String", "BUILD_TIMESTAMP_UTC", "\"${buildTimestampUtc}\"")
        def samsungHrvEnabled = providers.gradleProperty("enableSamsungHrv").orElse("false").get()
        if (!(samsungHrvEnabled in ["true", "false"])) {
            throw new GradleException("enableSamsungHrv must be true or false")
        }
        buildConfigField "boolean", "SAMSUNG_HRV_ENABLED", samsungHrvEnabled

//        manifestPlaceholders["repo"] = gitUrl()
//        manifestPlaceholders["branch"] = gitBranch()
//        manifestPlaceholders["commit"] = gitCommit()

        // Inject OpenWeather API key from local.properties into BuildConfig
        def lp = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) lp.load(lpFile.newDataInputStream())
        def owKey = lp.getProperty("OPENWEATHER_API_KEY", "")
        buildConfigField "String", "OPENWEATHER_API_KEY", "\"${owKey}\""
        // CI supplies the authorized Community PDL without exposing it in command arguments.
        def communityPdl = System.getenv("DITTO_COMMUNITY_IDENTITY")?.trim()
        def dittoCommunityIdentity = communityPdl
                ? groovy.json.JsonOutput.toJson(communityPdl)
                : (project.findProperty("dittoCommunityIdentity") ?: "\"\"")

        buildConfigField(
                "String",
                "DITTO_COMMUNITY_IDENTITY",
                dittoCommunityIdentity
        )
    }

    // Grab android key vars, prioritize Gitlab env vars, fall back on local signing.properties

    signingConfigs {
        debug {
            def keystorePath = signingValue(
                    "WEARTAK_DEBUG_KEYSTORE_FILE",
                    "DEBUG_KEYSTORE_FILE"
            )

            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
                storePassword signingValue(
                        "WEARTAK_DEBUG_STORE_PASSWORD",
                        "DEBUG_STORE_PASSWORD"
                )
                keyAlias signingValue(
                        "WEARTAK_DEBUG_KEY_ALIAS",
                        "DEBUG_KEY_ALIAS"
                )
                keyPassword signingValue(
                        "WEARTAK_DEBUG_KEY_PASSWORD",
                        "DEBUG_KEY_PASSWORD"
                )
            }
        }

        release {
            def keystorePath = signingValue(
                    "WEARTAK_RELEASE_KEYSTORE_FILE",
                    "RELEASE_KEYSTORE_FILE"
            )

            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
                storePassword signingValue(
                        "WEARTAK_RELEASE_STORE_PASSWORD",
                        "RELEASE_STORE_PASSWORD"
                )
                keyAlias signingValue(
                        "WEARTAK_RELEASE_KEY_ALIAS",
                        "RELEASE_KEY_ALIAS"
                )
                keyPassword signingValue(
                        "WEARTAK_RELEASE_KEY_PASSWORD",
                        "RELEASE_KEY_PASSWORD"
                )
            }
        }
    }

    def isBuildingBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }

    splits {
        abi {
            enable !isBuildingBundle
            reset()
            include "armeabi-v7a"
            universalApk false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            def cepSimulation = project.findProperty("CEP_SIMULATION") ?: "false"
            buildConfigField("Boolean", "CEP_SIMULATION", cepSimulation.toString())
            def cepTestAlerts = project.findProperty("CEP_TEST_ALERTS") ?: "false"
            buildConfigField("Boolean", "CEP_TEST_ALERTS", cepTestAlerts.toString())
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            def cepSimulation = "false"
            buildConfigField("Boolean", "CEP_SIMULATION", cepSimulation.toString())
            def cepTestAlerts = "false"
            buildConfigField("Boolean", "CEP_TEST_ALERTS", cepTestAlerts.toString())
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
    buildFeatures {
        compose true
        buildConfig true
        aidl true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packaging {
        resources {
            exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { test ->
            // Robolectric writes a download-lock file under user.home; override to a
            // writable build dir so tests work under sandboxed/CI environments where the
            // default home is read-only.
            def roboHome = file("${buildDir}/test-home")
            test.systemProperty 'user.home', roboHome.absolutePath
            test.environment 'HOME', roboHome.absolutePath
            test.doFirst {
                roboHome.mkdirs()
            }
        }
    }
}

