pluginManagement {
    repositories {
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
    }
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal() // For hive-btle local publishing
        repositories {
            flatDir { dirs 'libs' }
        }
    }
}

// Composite build for hive-btle development (changes propagate immediately)
// Enable this for local development, disable for published versions
includeBuild('../hive-btle/android') {
    dependencySubstitution {
        substitute module('com.revolveteam:hive') using project(':')
    }
}

rootProject.name = "WearTAK-CIV"
include ':app'
