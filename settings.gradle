pluginManagement {
    repositories {
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
    }
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal() // For peat-btle local publishing
        repositories {
            flatDir { dirs 'libs' }
        }
    }
}

// Composite build for peat-btle development (changes propagate immediately).
// The dependency-substitution coordinate must match the one declared in
// app/build.gradle exactly — `com.defenseunicorns:peat-btle`. The earlier
// `com.defenseunicorns:peat` substitution didn't match any declared
// dependency, so composite build was silently a no-op (peat-atak-plugin
// hit and fixed the same bug at peat-atak-plugin#17). Without composite
// build engaging, every watch build resolved against an old maven snapshot
// and never picked up local peat-btle source changes — including the
// PeatHealthStatus wire byte-order fix and the activity_level / alerts
// surfacing on DataReceivedResult that peat-btle#52 required.
includeBuild('../peat-btle/android') {
    dependencySubstitution {
        substitute module('com.defenseunicorns:peat-btle') using project(':')
    }
}

rootProject.name = "WearTAK-CIV"
include ':app'
