    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        repositories {
            flatDir { dirs 'libs' }
        }
    }
}

rootProject.name = "WearTAK-CIV"
include ':app'
