variables:
  GRADLE_BUILD_LAUNCHER_TAG: "2.6.2"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - test
  - build
  - publish

release_publisher_tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint: [""]
  script:
    - python -m unittest discover -s ci/tests -v


# ---------------------------------------------------------------------------
# Common WearTAK release build
#
# This is a hidden job and does not run by itself.
# develop_release and official_release both reuse this build configuration.
# ---------------------------------------------------------------------------

.release_build:
  stage: build

  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]

  before_script:
    - chmod +x gradlew

    # Verify required CI variables exist.
    - |
      [ -n "$WEARTAK_RELEASE_KEYSTORE_B64" ] || { echo "ERROR: WEARTAK_RELEASE_KEYSTORE_B64 missing"; exit 1; }
      [ -n "$RELEASE_STORE_PASSWORD" ] || { echo "ERROR: RELEASE_STORE_PASSWORD missing"; exit 1; }
      [ -n "$RELEASE_KEY_ALIAS" ] || { echo "ERROR: RELEASE_KEY_ALIAS missing"; exit 1; }
      [ -n "$RELEASE_KEY_PASSWORD" ] || { echo "ERROR: RELEASE_KEY_PASSWORD missing"; exit 1; }
      [ -n "$DITTO_COMMUNITY_IDENTITY" ] || { echo "ERROR: DITTO_COMMUNITY_IDENTITY missing"; exit 1; }

    # Recreate the exact release keystore used locally.
    - printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/app/weartak.keystore"
    - chmod 600 "$CI_PROJECT_DIR/app/weartak.keystore"

    # Recreate signing.properties exactly as the local release build expects.
    - |
      cat > "$CI_PROJECT_DIR/signing.properties" <<EOF
      RELEASE_KEYSTORE_FILE=app/weartak.keystore
      RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
      RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
      RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
      EOF

    # Confirm the keystore/password/alias combination before spending 17 minutes building.
    - |
      keytool -list \
        -keystore "$CI_PROJECT_DIR/app/weartak.keystore" \
        -storepass "$RELEASE_STORE_PASSWORD" \
        -alias "$RELEASE_KEY_ALIAS" >/dev/null

      echo "Release keystore verified."

    - java -version
    - ./gradlew --version


  script:
    # Build the same release APK that we previously built manually.
    - ./gradlew --no-daemon clean assembleRelease

    # Verify that the resulting APK is signed with the established
    # WearTAK Android production certificate.
    - |
      APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"

      if [ -z "$APK" ]; then
        echo "ERROR: Release APK was not produced."
        exit 1
      fi

      APKSIGNER="/opt/android-sdk-linux/build-tools/35.0.0/apksigner"

      if [ ! -x "$APKSIGNER" ]; then
        echo "ERROR: apksigner not found at $APKSIGNER"
        exit 1
      fi

      EXPECTED_SIGNER="1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d"

      "$APKSIGNER" verify "$APK" || { echo "ERROR: APK signature verification failed."; exit 1; }

      ACTUAL_SIGNER="$(
        "$APKSIGNER" verify --print-certs "$APK" |
        sed -n 's/.*certificate SHA-256 digest: //p' |
        head -1 |
        tr '[:upper:]' '[:lower:]'
      )"

      echo "Release APK: $APK"
      echo "Expected signer: $EXPECTED_SIGNER"
      echo "Actual signer:   $ACTUAL_SIGNER"

      if [ "$ACTUAL_SIGNER" != "$EXPECTED_SIGNER" ]; then
        echo "ERROR: Unexpected Android signing certificate."
        exit 1
      fi

      echo "Release signing verified."

    # Bind publication to the exact APK whose production signature was checked.
    - sha256sum "$APK" > app/build/outputs/apk/release/verified-apk.sha256

# ---------------------------------------------------------------------------
# Develop build
#
# Runs automatically whenever code is pushed/merged into develop.
# Produces a signed release APK for internal testing.
# ---------------------------------------------------------------------------

develop_release:
  extends: .release_build

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/verified-apk.sha256
      - app/build/outputs/apk/release/output-metadata.json

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'


# ---------------------------------------------------------------------------
# Official release
#
# Runs only when an official version tag is created.
#
# Examples:
#   v5.8.0
#   v5.8.0.2
#
# This is the job/pipeline whose URL should be provided to TPC when that
# APK is intended for official publication.
# ---------------------------------------------------------------------------

official_release:
  extends: .release_build

  artifacts:
    when: always
    expire_in: never
    paths:
      - app/build/outputs/apk/release/*.apk

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/'

# No needs: wait for all earlier stages to succeed, not only the build job.
publish_github_develop:
  stage: publish
  image:
    name: python:3.12-slim
    entrypoint: [""]
  dependencies:
    - develop_release
  resource_group: wearos-github-development
  interruptible: false
  script:
    - python ci/publish_github_release.py
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "core/weartak-core/wearos-tak-civ" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

# Same signed artifact and serialized writer, with a separate personal-only token.
# The full Python image includes Git; no second Android build/signing job runs.
publish_personal_github_develop:
  extends: publish_github_develop
  image:
    name: python:3.12-bookworm
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - python ci/publish_github_release.py --personal